{% extends 'base.html' %}

{% block title %}Login - LeaveDesk{% endblock %}

{% block content %}

<div class="auth-shell">
    <div class="card shadow-sm" style="max-width:440px; width:100%;">

        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <span class="brand-badge mb-2" style="width:52px;height:52px;font-size:1.5rem;">
                    <i class="bi bi-briefcase-fill"></i>
                </span>
                <h3 class="fw-bold mt-3 mb-0">Welcome back</h3>
                <p class="text-muted">Sign in to your LeaveDesk account</p>
            </div>

            <form method="POST" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Employee ID</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" value="{{ username|default:'' }}" placeholder="e.g. EMP102" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="passwordField" class="form-control" placeholder="Your password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Don't have an account?
                <a href="{% url 'register' %}" class="fw-semibold text-decoration-none">Register here</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdField = document.getElementById('passwordField');
    const icon = document.getElementById('toggleIcon');
    toggleBtn.addEventListener('click', function () {
        const isPassword = pwdField.type === 'password';
        pwdField.type = isPassword ? 'text' : 'password';
        icon.classList.toggle('bi-eye');
        icon.classList.toggle('bi-eye-slash');
    });
</script>
{% endblock %}
